[project]
name = "metadata-file-stripper"
version = "0.1.0"
description = "EXIF stripper format"
readme = "README.md"
authors = [
    { name = "Eulier González", email = "eulier1@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pillow>=13.0.0",
]

[project.scripts]
mfs = "metadata_file_stripper.cli:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
